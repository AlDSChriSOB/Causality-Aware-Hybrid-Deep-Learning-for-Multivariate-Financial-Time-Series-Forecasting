name: Paper 2 robust forecasting experiments
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_robust_experiments.py'
      - 'scripts/test_graph_screen.py'
      - 'SP500.csv'
      - '.github/workflows/paper2-robust.yml'
  push:
    branches: [research/validated-forecast-pipeline]
    paths:
      - 'scripts/run_robust_experiments.py'
      - 'scripts/test_graph_screen.py'
      - '.github/workflows/paper2-robust.yml'
      - 'SP500.csv'
      - '.github/workflows/paper2-robust.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  robust-experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/validated-forecast-pipeline
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn scipy statsmodels matplotlib
      - name: Validate Granger graph screen on synthetic data
        run: python scripts/test_graph_screen.py
      - name: Run validated experiments
        run: python scripts/run_robust_experiments.py --data SP500.csv --out results/advanced
      - name: Commit experiment results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/advanced/
          if ! git diff --cached --quiet; then
            git commit -m "Add robust Paper 2 forecast results"
            git push origin research/validated-forecast-pipeline
          fi
      - name: Upload result bundle
        uses: actions/upload-artifact@v4
        with:
          name: paper2-robust-results
          path: results/advanced/
          if-no-files-found: error
