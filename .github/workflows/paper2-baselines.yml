name: Paper 2 baseline experiments
on:
  push:
    branches: [main]
    paths:
      - 'SP500.csv'
      - 'scripts/run_baseline_experiments.py'
      - '.github/workflows/paper2-baselines.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn scipy
      - name: Run chronological baselines
        run: python scripts/run_baseline_experiments.py --data SP500.csv --out results/baseline
      - name: Commit reproducible results to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/baseline/
          if ! git diff --cached --quiet; then
            git commit -m "Add reproducible Paper 2 baseline results"
            git push
          fi
      - name: Upload reproducible results
        uses: actions/upload-artifact@v4
        with:
          name: paper2-baseline-results
          path: results/baseline/
          if-no-files-found: error
